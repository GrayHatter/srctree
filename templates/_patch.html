      <For Files>
        <patch>
        <details open="open">
          <summary>
          <header>
            <span><Filename /></span>
            <strong><DiffStat /></strong>
          </header>
          </summary>
          <changes>
            <Switch PatchView>
              <Case Inlined><DiffLines type="safe" /></Case>
              <Case Split><div class="split">
              <span><DiffLinesLeft type="safe" /></span>
              <span><DiffLinesRight type="safe" /></span>
            </div></Case>
            </Switch>
          </changes>
        </details>
        </patch>
      </For>
    <Build _ scroller.html />
