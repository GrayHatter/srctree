      <For Files>
        <patch>
        <details open=open>
          <summary>
          <header>
            <span><Filename /></span>
            <div>
              <strong><DiffStat /></strong>
              <span class="showclosed muted">collapsed</span>
            </div>
          </header>
          </summary>
          <changes>
            <Switch PatchView>
              <Case Inlined><DiffLinesBoth type="safe" /></Case>
              <Case Split><div class="split">
                <split><DiffLinesLeft type="safe" /></split>
                <split><DiffLinesRight type="safe" /></split>
              </div></Case>
            </Switch>
          </changes>
        </details>
        </patch>
      </For>
    <Build _ scroller.html />
