      <div class="repo-header">
        <div>
          <h3><a href="/repo/<RepoName />"><RepoName/></a></h3>
          <span class=description><Description /></span>
        </div>
        <div class="repo-header-side">
        <With GitUri><div class="gituri">git clone https://<Host />/repo/<RepoName /></div></With>
        <div class="act-btns">
          <With Upstream><a class="btn" href="<Href>">Go To Upstream</a></With>
          <With Blame><a class="btn" href="/repo/<RepoName />/blame/<Filename />">Blame</a></With>
          <a class="btn" href="/repo/<RepoName />/search">Search</a>
          <a class="btn" href="/repo/<RepoName />/issues/">Issues<sup><IssueCount type="?usize" /></sup></a>
          <a class="btn" href="/repo/<RepoName />/diffs/">Diffs<sup><DiffCount type="?usize" /></sup></a>
        </div>
        </div>
      </div>
